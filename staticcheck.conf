checks = ["inherit", "-ST1005"]

# 说明（与 GEAR_工程方法_v1.md §5 的「静态」闸门配套）：
#
# ST1005「error strings should not be capitalized」在本项目一律关闭，理由：
#   本项目错误信息是**中文**的，形如 `fmt.Errorf("Tool %s 未注册", id)`、
#   `fmt.Errorf("SMTP 连接失败: %w", err)`——开头的 Tool / SMTP / Flow 是**专有名词**
#   （类型名、协议名），既不能小写也不能省；而 ST1005 这条规则源自英文惯例
#   「error string 首字母不大写，便于 `%w` 串接后读作一句通顺的英文」，对中文不成立。
#   ——57 条告警全部属于这一类，改文案只会让报错更难读，故在配置层关闭，
#   并在此登记理由，避免后来者以为「闸门被悄悄放宽了」。
#
# 其余检查（含 SA* 正确性类、S1* 简化类、U1000 死代码）**保持开启**：
#   2026-09-20 全量核对时清掉了 SA4006（SMTP SSL 路径的变量遮蔽 bug）、
#   U1000（withLLMOverrides 未接线 → 已接线）、S1007/S1008/S1009 共 6 条，当前零残留。
# 新增告警应当修代码，而不是往这个列表里加例外。
