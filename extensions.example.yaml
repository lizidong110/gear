# Gear 扩展原语配置（PRD §9，去内置化 + 配置化加载）。
#
# 用法：把本文件复制为 extensions.yaml 放在工作目录即可启用自定义扩展；
# 不建 extensions.yaml 时 gear 回退默认 ext.ai（进程内 Eino agent，无需 sidecar）。
# 也可设 GEAR_EXT_CONFIG 指向任意路径的配置文件，覆盖默认查找位置。
#
# 每个扩展（sidecar 载体）：
#   cmd:     sidecar 启动命令（任意语言写的小程序，读 stdin JSON、写 stdout 末行 JSON）
#   methods: 暴露给 ctx.ext.<name> 的方法
#   kind:    "sidecar"（默认，任意语言子进程）或 "agent"（进程内 Go 承载；目前仅 ext.ai）
#
# ext.ai 是 gear 内建的进程内 agent（取代原 sidecar 子进程），**始终由 gear 注册**，
# 无需在配置里声明；配置里只列其它 sidecar 扩展（如 ext.tls / ext.db）。发布后想加一个
# 原生能力（如 TLS），只需在这里加一段，不必改 gear 源码：
#   ext.tls:
#     cmd: ["./tls-sidecar"]
#     methods: [issue, verify, renew]
#     schemas:
#       issue: { description: 签发, parameters: { domain: {type: string, required: true} } }
# 然后 Tool 声明 capabilities: [ext.tls]，Lua 里即可 local c = ctx.ext.tls.issue({ domain = "x.com" })。
# 注意：ext.registry 是 gear 内建进程内扩展（读引擎 registry，供 agent 自我锚定），无需在此声明。
#
# 同理无需在此声明的是**内核原语**：受门禁的 8 个（http/call/db/secret/event/subscribe/config/fs，
# 由 Tool 的 capabilities 声明后使用；fs 为受安全目录收口的文件读写，默认根 GEAR_APP_DATA）与
# 始终可用的 3 个纯函数原子（time/template/crypto，
# 无需任何声明即可用，如 Flow 直调 call: crypto.hash、Lua 里 ctx.time.now({})）。
# 它们不是 ext.*，不进本文件；能力目录见 `gear ai capabilities`。
#
# ⚠ 配置存在时「以配置为准」：未列出的 sidecar 扩展不会被注册。ext.ai 不受此限（始终注册）。
# ⚠ service ext 的协调地址**唯一真相源是 `listen`**（2026-09-21）：引擎按它注入 COORD_ADDR 给侧车，
#   health_probe.addr 省略即取 listen、显式不一致则装配期 fail-closed；故 service ext 的 health_probe 不写 addr。
# ⚠ 严格必填：每个 ext.* 必须声明 schemas（每个方法的参数 schema，供 agent 经
#   ext.registry.capabilities() 自我锚定，堵住「tool entry 幻觉 ctx.* 参数」缺口；
#   缺 schemas 或 methods 与 schemas 不一致时 gear 启动即报错）。
#
# 生成配方（ai.gen-flow/tool/hook）**默认内嵌**在 internal/engine/recipes/*.yaml；
# 如需自定义，在 examples/ai/recipes/ 放同名 YAML 即可覆盖（该目录**默认不存在、可选**），
# 或用 GEAR_AI_RECIPES 指向任意目录（其下需有 flow.yaml/tool.yaml/hook.yaml）。均无需重编 gear。

# ext.ai（进程内 Eino agent）由 gear **始终注册**，方法清单与参数 schema 全部内置
# （defaultAISchemas：complete / catalog / domains / validate / generate / capabilities / react），
# 配置里的 ext.ai 段会被**整段忽略**（不校验、不采用）——故这里不再放示例段，避免
# 「抄了一份过期的方法清单，以为 react 不存在」这类误读。要看当前真实清单：
#   gear ai capabilities
#
# 同理，ext.registry（读引擎 registry，供 agent 自我锚定）也是内建的，无需在此声明。

# ── ext.db：**示例 sidecar 源码已移除**（2026-09-19）─────────────────────────
# 连数据库请优先用**内置 db 原语**：Tool 声明 capabilities:[db] 即可
#   ctx.db.query({driver,dsn,sql,params})（sqlite/mysql/postgres，见 internal/cap/sqldb.go）；
# 下面整段已注释，仅在「想用完全自定义 sidecar 承载 DB」时作形态参考——
# 取消注释并把 cmd 换成你自己的 sidecar 可执行文件即可启用。
# 历史形态（原示例 examples/gear-db-sidecar 已移除）：
#
# ⚠ 已被内置 db 原语取代：内核的 cap.DB 现已原生支持多后端（sqlite/mysql/postgres），
#   Tool 声明 capabilities:[db] 即可 ctx.db.query({driver,dsn,sql,params})，无需本 sidecar。
#   本段仅作为「想用完全自定义 sidecar 承载 DB」时的参考，新场景请优先用内置 db。
#
# driver/dsn 走调用参数或 env（GEAR_DB_DRIVER / GEAR_DB_DSN）；SQL 写在 Lua Tool 里。
#   local r = ctx.ext.db.query({ driver="postgres", dsn=ctx.input.dsn,
#                                sql="SELECT * FROM t WHERE id=?", params={ ctx.input.id } })
# 释放方法：query（返回 columns/rows/row_count）、exec（返回 rows_affected）、ping（探活）。
# DSN 常含口令：优先用 GEAR_DB_DSN 或 Flow 里的 ${secrets.*}，不要硬编码进 YAML。
# ext.db:
#   cmd: ["go", "run", "./plugin/gear-db-sidecar"]
#   methods: [query, exec, ping]
#   schemas:
#     query:
#       description: 参数化查询，返回 {columns, rows, row_count}
#       parameters:
#         driver: {type: string, enum: [sqlite, sqlite3, mysql, mariadb, postgres, postgresql, pg], description: "数据库驱动（缺省走 env GEAR_DB_DRIVER）"}
#         dsn: {type: string, description: "数据源名/连接串（缺省走 env GEAR_DB_DSN）"}
#         sql: {type: string, description: "SQL（用 ? 占位符，配套 params）", required: true}
#         params: {type: array, description: "预编译占位符参数（按顺序，可选）"}
#     exec:
#       description: 执行写操作，返回 {rows_affected}
#       parameters:
#         driver: {type: string, enum: [sqlite, sqlite3, mysql, mariadb, postgres, postgresql, pg], description: "数据库驱动（缺省走 env GEAR_DB_DRIVER）"}
#         dsn: {type: string, description: "数据源名/连接串（缺省走 env GEAR_DB_DSN）"}
#         sql: {type: string, description: "SQL（用 ? 占位符，配套 params）", required: true}
#         params: {type: array, description: "预编译占位符参数（按顺序，可选）"}
#     ping:
#       description: 探活，返回 {ok:true}
#       parameters:
#         driver: {type: string, enum: [sqlite, sqlite3, mysql, mariadb, postgres, postgresql, pg], description: "数据库驱动（缺省走 env GEAR_DB_DRIVER）"}
#         dsn: {type: string, description: "数据源名/连接串（缺省走 env GEAR_DB_DSN）"}

# ─────────────────────────────────────────────────────────────────────────────
# 通知类可扩展原子（P1 样板，统一注册表见 plugin/extensions.yaml；Go 单二进制载体 `gear ext`）：
#   ext.email  —— SMTP 发邮件（send）
#   ext.webhook —— outbound webhook（send，POST JSON）
#   ext.wecom   —— 企业微信群机器人（send，text/markdown）
# 三者均为「桥接具体外部系统的原生单操作」，业务规则留给 Flow / 领域 Lua 工具。
# AI 原子已是内核内置的 ext.ai（进程内 Eino agent，始终注册），无需在此声明。
ext.email:
  cmd: ["./gear.exe", "ext", "email"]
  methods: [send, read, list]
  schemas:
    send:
      description: SMTP 发送邮件（单操作原子，无业务规则）
      parameters:
        to: {type: string, description: "收件人（字符串或数组）", required: true}
        subject: {type: string, description: "主题"}
        body: {type: string, description: "正文"}
        cc: {type: string, description: "抄送（字符串或数组，可选）"}
        html: {type: boolean, description: "正文是否 HTML（默认 false）"}
        from: {type: string, description: "发件人（缺省等于 user）"}
        host: {type: string, description: "SMTP 主机", required: true}
        port: {type: number, description: "SMTP 端口（默认 465）"}
        user: {type: string, description: "SMTP 账号", required: true}
        pass: {type: string, description: "SMTP 密码", required: true}
        ssl: {type: boolean, description: "是否 SSL（默认 true）"}
        mode: {type: string, description: "send 真实发送 / log 落盘（默认 send）"}
        log_path: {type: string, description: "log 模式落盘路径（默认 email.out.log）"}
    list:
      description: IMAP 列目录 / 列邮件摘要（target=mailboxes 列文件夹；target=messages 列某邮箱最近 N 封）
      parameters:
        host: {type: string, description: "IMAP 主机", required: true}
        port: {type: number, description: "IMAP 端口（默认 993）"}
        user: {type: string, description: "IMAP 账号", required: true}
        pass: {type: string, description: "IMAP 密码", required: true}
        ssl: {type: boolean, description: "是否隐式 TLS（默认 true，端口 993）"}
        target: {type: string, enum: [mailboxes, messages], description: "mailboxes 列文件夹 / messages 列邮件（默认 messages）"}
        mailbox: {type: string, description: "目标邮箱（默认 INBOX，仅 messages 用）"}
        limit: {type: number, description: "messages 模式下返回最近几封（默认 20）"}
    read:
      description: IMAP 读单封完整内容（按 uid）
      parameters:
        host: {type: string, description: "IMAP 主机", required: true}
        port: {type: number, description: "IMAP 端口（默认 993）"}
        user: {type: string, description: "IMAP 账号", required: true}
        pass: {type: string, description: "IMAP 密码", required: true}
        ssl: {type: boolean, description: "是否隐式 TLS（默认 true，端口 993）"}
        mailbox: {type: string, description: "目标邮箱（默认 INBOX）"}
        uid: {type: number, description: "邮件 UID（来自 list 的 uid 字段）", required: true}
        mark_seen: {type: boolean, description: "读后标记已读（默认 false）"}

ext.webhook:
  cmd: ["plugin/webhook-sidecar.exe"]   # 真实 webhook-sidecar 侧车（plugin/webhook-sidecar；需先 go build -o build/plugin/webhook-sidecar.exe ./plugin/webhook-sidecar）
  methods: [send, subscribe, unsubscribe]
  service: true                        # 常驻能力：侧车长驻（coord:8089 + 入站回调:8088 两端口）
  source: webhook                      # 声明承载「webhook」事件源（供通用订阅原语 ctx.subscribe 使用）
  listen: "127.0.0.1:8089"
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    send:
      description: 向预配置/指定 URL POST JSON（outbound webhook 原子，复用侧车长连接）
      parameters:
        url: {type: string, description: "目标 URL", required: true}
        payload: {type: object, description: "请求体（必填）", required: true}
        headers: {type: object, description: "附加请求头（可选）"}
        method: {type: string, description: "HTTP 方法（默认 POST）"}
    subscribe:
      description: 监听一个入站 URL（外部系统 POST 到 /in/{path} 时回推事件）；通常经 ctx.subscribe.start 使用
      parameters:
        path: {type: string, description: "入站路由路径（外部 POST /in/{path}）", required: true}
        callback_url: {type: string, description: "事件回推地址（缺省由 ctx.subscribe 注入）"}
    unsubscribe:
      description: 按 handle 取消一条长驻订阅（ctx.ext.webhook.subscribe 登记的路由）
      parameters:
        handle: {type: string, description: "subscribe 返回的订阅句柄", required: true}

ext.wecom:
  cmd: ["./gear.exe", "ext", "wecom"]
  methods: [send]
  schemas:
    send:
      description: 企业微信群机器人 webhook 发送（text/markdown）
      parameters:
        key: {type: string, description: "群机器人 key", required: true}
        content: {type: string, description: "文本内容（必填）", required: true}
        msgtype: {type: string, enum: [text, markdown], description: "消息类型（默认 text）"}
        mentioned_list: {type: array, description: "提及成员 userid 列表（可选）"}
        mentioned_mobile_list: {type: array, description: "提及成员手机号列表（可选）"}

# ─────────────────────────────────────────────────────────────────────────────
# 常驻能力（service ext）示例：MQTT 订阅/发布（EXT_SERVICE_DESIGN.md §3/§4/§12）
#
# 与上面"一次性 sidecar"不同，service ext 声明 service:true 后会被 gear 当成一个
# 长驻进程监管（process Tool + Supervisor：重启策略 / 健康探针 / 进程树级联回收），
# 而非"调一次退一次"。
#
#   - listen：侧车常驻监听的本地 RPC 地址（127.0.0.1 only）。Gear 经本地 HTTP 调其方法
#     （publish），侧车内部维护一条 MQTT 长连接，彻底消除"每次重连"的浪费；
#   - health_probe：复用 Tool 健康探针，连续失败按阈值杀掉并重启；
#   - 多 gear 共享：同主机多个 gear 都需要 ext.mqtt 时，由 coord 机制保证仅一个 sidecar
#     实例绑定 :1884（首个 gear 拉起、其余 Register PID 复用），占用列表空则侧车自动退出。
#
# flow 里这样引用（step 走 process 虚拟 Tool + Start 路径）：
#   flows:
#     - id: mqtt-daemon
#       steps:
#         - id: s1
#           call: ext.mqtt          # 命中虚拟 process Tool（由 service ext 自动生成）
#           mode: service           # 长驻
ext.mqtt:
  cmd: ["plugin/mqtt-sidecar.exe"]   # 真实 mqtt-sidecar 侧车（plugin/mqtt-sidecar；需先 go build -o build/plugin/mqtt-sidecar.exe ./plugin/mqtt-sidecar）
  methods: [publish, subscribe]
  service: true
  source: mqtt                      # 声明承载「mqtt」事件源（供通用订阅原语 ctx.subscribe 使用）
  listen: "127.0.0.1:1884"
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    publish:
      description: 发布 MQTT 消息（经侧车长连接复用，非每次重连）
      parameters:
        topic: {type: string, description: "主题", required: true}
        payload: {type: string, description: "消息体", required: true}
        qos: {type: number, description: "QoS（0/1/2，默认 0）"}
    subscribe:
      description: 订阅主题（长驻消费：sidecar 维护 handle→callbackURL 映射，收到消息按 handle 回推对应 Gear）
      parameters:
        topic: {type: string, description: "主题（支持 +/# 通配）", required: true}

# ─────────────────────────────────────────────────────────────────────────────
# P2 消息 / 短信原子（service ext）：RabbitMQ / Kafka / SMS
#
# 关键：consume 是「直接可调」的一等方法（不再只能经 ctx.subscribe 一条特例）：
#   - mode=pull（默认）拉取最多 max_messages 条，同步返回；
#   - mode=push 长驻订阅，收到消息即回推事件；
#   - 长驻可用 unsubscribe 按 handle 停掉（start/stop 闭环）。
# 权威注册表见 plugin/extensions.yaml。
ext.rabbitmq:
  cmd: ["plugin/rabbitmq-sidecar.exe"]
  methods: [publish, declare, consume, unsubscribe]
  service: true
  source: rabbitmq
  listen: "127.0.0.1:5674"
  health_probe: {kind: tcp, interval: 5s, threshold: 3}
  schemas:
    publish:
      description: 向指定 exchange/routing_key 发布一条消息
      parameters:
        url: {type: string, description: "连接串（amqp://user:pass@host:port/，优先于分项）"}
        host: {type: string, description: "主机（默认 localhost）"}
        port: {type: number, description: "端口（默认 5672）"}
        user: {type: string, description: "账号（默认 guest）"}
        pass: {type: string, description: "密码（默认 guest）"}
        exchange: {type: string, description: "交换机（默认空直连默认交换机）"}
        routing_key: {type: string, description: "路由键"}
        body: {type: string, description: "消息体（str 或 JSON 对象）"}
        persistent: {type: boolean, description: "是否持久化（默认 true）"}
    declare:
      description: 声明 queue / exchange
      parameters:
        url: {type: string, description: "连接串（优先于分项）"}
        host: {type: string, description: "主机（默认 localhost）"}
        port: {type: number, description: "端口（默认 5672）"}
        user: {type: string, description: "账号（默认 guest）"}
        pass: {type: string, description: "密码（默认 guest）"}
        kind: {type: string, enum: [queue, exchange], description: "声明类型", required: true}
        name: {type: string, description: "名称", required: true}
    consume:
      description: 消费队列（直接调用）。mode=pull 拉一批返回（取出后 ack）/ mode=push 长驻订阅，仅回推成功才 ack（失败 nack 重入队）
      parameters:
        url: {type: string, description: "连接串（amqp://user:pass@host:port/）"}
        host: {type: string, description: "主机（默认 localhost）"}
        port: {type: number, description: "端口（默认 5672）"}
        user: {type: string, description: "账号（默认 guest）"}
        pass: {type: string, description: "密码（默认 guest）"}
        queue: {type: string, description: "消费目标队列", required: true}
        mode: {type: string, enum: [pull, push], description: "pull 拉一批返回（默认）/ push 长驻订阅回推"}
        max_messages: {type: number, description: "pull 模式单次最多拉取条数（默认 1）"}
        handle: {type: string, description: "push 模式订阅句柄（缺省自动生成并返回）"}
        callback_url: {type: string, description: "push 模式事件回推地址（mode=push 时必填）"}
    unsubscribe:
      description: 按 handle 取消一条长驻消费
      parameters:
        handle: {type: string, description: "consume(mode=push) 返回的订阅句柄", required: true}

ext.kafka:
  cmd: ["plugin/kafka-sidecar.exe"]
  methods: [produce, consume, unsubscribe]
  service: true
  source: kafka
  listen: "127.0.0.1:9094"
  health_probe: {kind: tcp, interval: 5s, threshold: 3}
  schemas:
    produce:
      description: 向指定 topic 生产一条消息
      parameters:
        topic: {type: string, description: "主题", required: true}
        brokers: {type: string, description: "broker 列表（逗号分隔，或数组）", required: true}
        key: {type: string, description: "分区键（可选）"}
        value: {type: string, description: "消息体（str 或 JSON 对象）"}
    consume:
      description: 消费 topic（直接调用）。mode=pull 拉一批返回（broker 先预检、成功返回后才提交 offset）/ mode=push 长驻订阅回推
      parameters:
        topic: {type: string, description: "主题", required: true}
        brokers: {type: string, description: "broker 列表（逗号分隔，或数组）", required: true}
        mode: {type: string, enum: [pull, push], description: "pull 拉一批返回（默认）/ push 长驻订阅回推"}
        group: {type: string, description: "消费组（pull 默认 gear-consume；push 默认 gear-{handle}）"}
        max_messages: {type: number, description: "pull 模式单次最多拉取条数（默认 1）"}
        timeout: {type: string, description: "pull 模式本批等待时长（如 5s，默认 5s）"}
        start: {type: string, enum: [earliest, latest], description: "无已提交 offset 时的起始位点（默认 latest）"}
        handle: {type: string, description: "push 模式订阅句柄（缺省自动生成并返回）"}
        callback_url: {type: string, description: "push 模式事件回推地址（mode=push 时必填）"}
    unsubscribe:
      description: 按 handle 取消一条长驻消费
      parameters:
        handle: {type: string, description: "consume(mode=push) 返回的订阅句柄", required: true}

ext.sms:
  cmd: ["./gear.exe", "ext", "sms"]
  methods: [send]
  schemas:
    send:
      description: 经 HTTP 短信网关发送一条短信（通用短信原子，运营商解耦）
      parameters:
        phone: {type: string, description: "手机号（字符串或数组，多号批量）", required: true}
        content: {type: string, description: "直接正文（与 template_id 二选一）"}
        gateway: {type: string, description: "短信网关 URL（必填，缺则运行期报错）", required: true}
        apikey: {type: string, description: "网关令牌（可选参数，传给 ext.sms）"}
        sign: {type: string, description: "短信签名（可选参数，传给 ext.sms）"}

# ─────────────────────────────────────────────────────────────────────────────
# P3 文件 / 网站服务原子（service ext）：静态网站服务（类似 nginx）
#
# 给定一个端口 + 一个本地静态网站目录，起一个 HTTP 服务即可在浏览器访问。
# 两个端口：listen(127.0.0.1:8095) 是 Gear 调 /start /stop /caps 的 RPC 端口；
# args.port 是网站对外服务端口（由 /start 入参决定）。
# 权威注册表见 plugin/extensions.yaml。
ext.serve:
  cmd: ["plugin/serve-sidecar.exe"]     # 真实 serve-sidecar 侧车（plugin/serve-sidecar；需先 go build -o build/plugin/serve-sidecar.exe ./plugin/serve-sidecar）
  methods: [start, stop]
  service: true                        # 常驻能力：侧车长驻，对外起静态网站 HTTP 服务
  listen: "127.0.0.1:8095"            # coord + RPC 端口（本地 HTTP 调其方法，复用长连接）
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    start:
      description: 起一个「静态网站 + 可选反向代理」服务（类似 nginx：给定端口 + 静态目录，可把某些前缀反代到后端）
      parameters:
        port: {type: number, description: "对外服务的监听端口（可选；省略或填 0 由内核自动分配空闲端口，返回值带回真实 port，供拼反代 target）"}
        dir: {type: string, description: "静态网站根目录（本地路径，必填参数，传给 ext.serve）", required: true}
        host: {type: string, description: "绑定地址（默认 0.0.0.0，即所有网卡；可改 127.0.0.1 仅本机）"}
        proxy: {type: array, description: "反向代理规则（类 nginx location + proxy_pass）：元素 {path,target,strip_prefix}。命中 path 前缀的请求转发到 target（多条取最长前缀），未命中回落静态文件；path 须以 / 开头、target 须为 http(s)://host[:port]，strip_prefix 默认 false（转发时去掉该前缀）。规则非法即报错（不静默丢弃）、后端不可达返回 502"}
    stop:
      description: 停止当前静态网站服务（释放端口）
      parameters: {}


# ───────── P3 文件类：ext.filestore（附件存取，2026-09-28 第二批 E2）─────────
#
# 语义要点（PRD §4.3）：
#   · root 不硬编码：省略 root 参数时读配置库的 `filestore.root`
#     （`gear config set filestore.root <目录>`，与 ctx.config 同源）；两者都没有即 fail-closed。
#   · 路径穿越防护：key 里的空段 / "." / ".." / 反斜杠一律拒，拼接后必须仍在 root 内，
#     **不跟随符号链接**（任何一级是符号链接且指向 root 外即拒）。
#   · 大小上限默认 32 MiB（配置库的 `filestore.max_bytes` 可放宽），超限在落盘前拒。
#   · 二进制走 base64（Lua 侧无字节类型）；不做 MIME 嗅探，content_type 信任调用方声明。
#   · url() 只返回相对路径 /_filestore/<key>——内核 REST 面 +0，绝对 URL 由应用自己挂。
ext.filestore:
  cmd: ["plugin/filestore-sidecar.exe"]   # 真实侧车（plugin/filestore-sidecar）
  methods: [put, get, stat, list, delete, url]
  service: true
  listen: "127.0.0.1:8096"               # coord + RPC 端口（本地 HTTP 调其方法）
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    put:
      description: 写入一个对象（key 为 root 内的相对路径，支持多级目录）
      parameters:
        key: {type: string, description: "root 内的相对路径（如 contracts/2026/a.pdf）", required: true}
        data_base64: {type: string, description: "对象二进制内容（base64 编码，Lua 侧无字节类型）", required: true}
        content_type: {type: string, description: "内容类型（不做嗅探，缺省 application/octet-stream）"}
        root: {type: string, description: "存储根目录（省略取配置库 filestore.root）"}
        max_bytes: {type: number, description: "本次写入的大小上限（省略取配置库 filestore.max_bytes，默认 33554432）"}
    get:
      description: 读取一个对象为 base64
      parameters:
        key: {type: string, description: "对象 key", required: true}
        root: {type: string, description: "存储根目录（省略取配置库 filestore.root）"}
    stat:
      description: 查看对象元信息（不返回内容）
      parameters:
        key: {type: string, description: "对象 key", required: true}
        root: {type: string, description: "存储根目录（省略取配置库 filestore.root）"}
    list:
      description: 列出 key（默认全量）
      parameters:
        prefix: {type: string, description: "只列该前缀下的 key"}
        root: {type: string, description: "存储根目录（省略取配置库 filestore.root）"}
    delete:
      description: 删除对象
      parameters:
        key: {type: string, description: "对象 key", required: true}
        root: {type: string, description: "存储根目录（省略取配置库 filestore.root）"}
    url:
      description: 取对象的相对访问路径（由应用自己挂反代/前端路由，内核不新增 REST 端点）
      parameters:
        key: {type: string, description: "对象 key", required: true}
        root: {type: string, description: "存储根目录（省略取配置库 filestore.root）"}


# ───────── P3 调度类：ext.cron（定时触发，2026-09-28 第二批 E3）─────────
#
# 语义要点（PRD §4.1 / §4.2）：
#   · **硬绑定**：侧车随应用起、随进程死而亡——进程一停调度立即停止且**不接管**，
#     重启后不会接回间隔期内错过的触发。系统只有「有进程在跑」与「没进程」两态，
#     不存在「表在、进程没了、谁在跑」的第三态。cron 表落盘只用于「重启后重建同一张时间表」。
#   · 幂等：去重键 = name + 触发时刻（分钟粒度），同一分钟内的重复触发静默丢弃。
#   · misfire：默认不补；显式 catch_up 也**只补最近一次**（补一整个窗口＝启动风暴）。
#   · overlap：默认跳过（上一轮没跑完又到点就跳过并点名日志），显式才并发。
#   · 表达式自己解析（5 段标准 cron + @ 宏），零新增依赖；非法表达式在 add/at 期就拒。
#   · **持久化表 ≠ 跨进程任务队列**：它不搬运没跑完的触发，只让重启后的新进程重建时间表。
ext.cron:
  cmd: ["plugin/cron-sidecar.exe"]       # 真实侧车（plugin/cron-sidecar）
  methods: [add, at, list, cancel]
  service: true                          # 常驻能力：侧车长驻，按 cron 表到点回推
  source: cron                           # 声明承载「cron」事件源（供 ctx.subscribe 使用）
  listen: "127.0.0.1:8097"               # coord + RPC 端口（本地 HTTP 调其方法）
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    add:
      description: 注册一条周期性任务（5 段 cron 表达式，非法即拒）
      parameters:
        name: {type: string, description: "任务名（唯一，去掉重与取消的键）", required: true}
        expr: {type: string, description: "5 段 cron：分 时 日 月 周（如 */5 * * * *、0 9 * * 1-5）"}
        at: {type: string, description: "一次性任务的时刻（与 expr 二选一；形如 2026-09-28 18:00）"}
        timezone: {type: string, description: "时区名（如 Asia/Shanghai；缺省 Local）"}
        callback_url: {type: string, description: "到点 POST 的地址（不给默认值，缺即拒）", required: true}
        payload: {type: object, description: "随触发一起 POST 的业务载荷（会明文落盘，别放密钥）"}
        catch_up: {type: boolean, description: "进程重启后是否补跑最近一次（默认 false）"}
        overlap: {type: boolean, description: "上一轮未结束时是否并发（默认 false＝跳过）"}
    at:
      description: 注册一次性任务（到点触发一次即消失）
      parameters:
        name: {type: string, description: "任务名（唯一）", required: true}
        at: {type: string, description: "时刻（形如 2026-09-28 18:00 或 RFC3339）", required: true}
        timezone: {type: string, description: "时区名（缺省 Local）"}
        callback_url: {type: string, description: "到点 POST 的地址", required: true}
        payload: {type: object, description: "业务载荷"}
        catch_up: {type: boolean, description: "at 已过时是否补跑最近一次（默认 false＝标记 expired）"}
    list:
      description: 列出任务（不回显 payload / callback_url）
      parameters: {}
    cancel:
      description: 按名字取消任务（不存在即报错）
      parameters:
        name: {type: string, description: "任务名", required: true}

# ─────────────────────────────────────────────────────────────────────────────
# ext.oidc（2026-09-28）: SSO 握手 —— 发现元数据 / 授权码换令牌（含 PKCE）/ JWKS 长驻缓存
#
#   · **只做「拿令牌」的握手**：不验签（验签归 `crypto.jwt_verify`）、不做会话
#     （state/nonce 由调用方自生成自校验，侧车只原样带回、不记任何登录态）。
#   · **issuer 混淆防线两道**：discovery 文档里的 issuer 必须与入参一致，
#     且 token_endpoint 的 host 必须与 issuer 同 host——否则「client_secret + 授权码」
#     会被送到攻击者自己的令牌端点，这是 OIDC 最经典的劫持面。换令牌这一步同样复查。
#   · **JWKS 长驻缓存**：命中缓存**一次 HTTP 都不发**；未知 kid 自动刷新一次；
#     刷新失败退回旧缓存并置 `stale:true`（fail-soft，但不静默）。
#   · 出网超时**统一 10s**（PRD §4.2 把仓库里 3s/5s/10s 三处约定拉齐）。
#   · 入站回调复用 /in/{path} 形态（浏览器从 IdP 弹回 ?code=&state=），
#     侧车只回报收到了什么，不换令牌、不建会话。
ext.oidc:
  cmd: ["plugin/oidc-sidecar.exe"]       # 真实侧车（plugin/oidc-sidecar）
  methods: [discovery, code_exchange, jwks]
  service: true                          # 常驻能力：侧车长驻并长驻缓存 JWKS
  listen: "127.0.0.1:8098"               # coord + RPC 端口
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    discovery:
      description: 取 issuer 的 OpenID 发现文档（issuer 混淆检查在此生效）
      parameters:
        issuer: {type: string, description: "Issuer 的绝对 URL（不给默认值，缺即拒）", required: true}
    code_exchange:
      description: 用授权码换令牌（支持 PKCE；client_secret 可选以兼容公开客户端）
      parameters:
        issuer: {type: string, description: "Issuer 的绝对 URL", required: true}
        code: {type: string, description: "授权码", required: true}
        client_id: {type: string, description: "客户端 ID", required: true}
        redirect_uri: {type: string, description: "回调地址（即使 IdP 允许省略也要求显式给）", required: true}
        client_secret: {type: string, description: "客户端密钥（公开客户端可不给；给了才随表单发出）"}
        code_verifier: {type: string, description: "PKCE 验证器（给了才随表单发出，不给就不带）"}
    jwks:
      description: 取 JWKS 长驻缓存（命中不发 HTTP；刷新失败退回旧缓存并置 stale）
      parameters:
        issuer: {type: string, description: "Issuer 的绝对 URL", required: true}

# ─────────────────────────────────────────────────────────────────────────────
# ext.excel（2026-09-29）: 零依赖 Excel 写出 —— 手写最小 OOXML（archive/zip + XML）
#
#   · **零第三方依赖**：`go.mod` / `go.sum` 零变动（AC-E4-4，可 `git diff` 机械验证）。
#   · **只做写出，不做读回**：读回留后批（PRD §4.5 已如实登记该副作用）。
#   · **cell 类型由值自身决定**：字符串 / 数字 / 布尔 / 空（nil）四类，
#     分别落为 inlineStr / number / boolean / 空单元格，不靠调用方标注 kind。
#   · **路径囚禁**：path 必须是 root 内的相对路径，`..` / 盘符 / 反斜杠一律拒
#     （fail-closed，不留半截文件）；判定统一走 internal/sidecar/outpath，不在此重写。
#   · root 缺省取进程 CWD（＝应用的 layout.workdir），**不是**硬编码「写到当前目录」。
ext.excel:
  cmd: ["plugin/xlsx-sidecar.exe"]       # 真实侧车（plugin/xlsx-sidecar）
  methods: [write]
  service: true                          # 常驻能力：侧车长驻，按调用写出
  listen: "127.0.0.1:8100"               # coord + RPC 端口
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    write:
      description: 写出一个 .xlsx（多 sheet；cell 支持 字符串/数字/布尔/空 四类）
      parameters:
        path: {type: string, description: "相对 root 的文件名（如 reports/2026.xlsx）", required: true}
        sheets: {type: array, description: "工作表数组：元素 {name, rows}；rows 是二维数组（每行一个数组）。name 不可重名（Excel 不区分大小写）；cell 支持 字符串/数字/布尔/空，类型由值自身决定", required: true}
        root: {type: string, description: "产物根目录（缺省取进程 CWD＝应用 workdir）；path 必须落在其内，越界即拒"}

# ─────────────────────────────────────────────────────────────────────────────
# ext.pdf（2026-09-29）: 零依赖 PDF 写出 + CJK 字体子集嵌入 —— 手写最小 PDF 写出器
#
#   · **CJK 嵌入字体子集**：运行时读系统 TTF（候选首推 simhei.ttf），按页面实际用到的
#     字符做最小子集嵌入（复合字形算依赖闭包），CIDFontType2 + ToUnicode + Identity-H
#     ——阅读器能正确选字、文本可复制（AC-E4-2）。
#   · **缺字即报错（`font_no_glyph`），绝不画方框**：换字体（用 font 参数）或先替换掉
#     该字符；不许静默降级成方框（verify P1e 有反向断言）。TTC / OTF 直接报错。
#   · **零第三方依赖**：`go.mod` / `go.sum` 零变动（AC-E4-4）。
#   · pages 同时接受 [{text="..."}] 与 ["..."] 两种写法（后者是 Lua 侧最自然的写法）。
#   · A4 几何、贪心折行（CJK 间可断）、页码溢出即报错、不写时间戳（可复现）。
ext.pdf:
  cmd: ["plugin/pdf-sidecar.exe"]        # 真实侧车（plugin/pdf-sidecar）
  methods: [write, read]
  service: true                          # 常驻能力：侧车长驻，按调用读写
  listen: "127.0.0.1:8101"               # coord + RPC 端口
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    write:
      description: 写出一份 PDF（A4；CJK 自动嵌入字体子集）
      parameters:
        path: {type: string, description: "相对 root 的文件名（如 reports/2026.pdf）；给绝对路径（D:/x/y.pdf）时本侧车自动拆成 root+文件名", required: true}
        pages: {type: array, description: "页数组：元素 {text}（也接受每页一个裸字符串的写法）；text 内 \\n 换行，超出一页自动分页", required: true}
        root: {type: string, description: "产物根目录（缺省取侧车进程 CWD——gear 的工作目录，通常不是你想要的落点，建议显式给）；path 必须落在其内，越界即拒"}
        font: {type: string, description: "显式指定字体文件路径（不给则走系统字体候选，首推 simhei.ttf）；TTC / OTF 直接报错"}
        font_size: {type: number, description: "字号（默认 12，可用区间 4~72，超出即拒）"}
    read:
      description: 读出 PDF 的文本（按页返回；Identity-H+ToUnicode / 简单字体 / FlateDecode / ObjStm 全覆盖；加密、无 ToUnicode、扫描件明确报错不吐乱码）
      parameters:
        path: {type: string, description: "相对 root 的 PDF 文件名（如 docs/讲义.pdf）；若你手里是绝对路径（D:/x/y.pdf 或 /home/x/y.pdf），必须拆开传：root 传所在目录、path 只传文件名（只给绝对路径不传 root 时本侧车也会自动拆，但显式拆开最稳）", required: true}
        root: {type: string, description: "读取根目录（缺省取侧车进程 CWD——那通常是 gear 的工作目录，不是目标文件所在目录，别依赖缺省）；path 必须落在其内，越界即拒"}
        max_pages: {type: number, description: "最多抽取的页数（默认 100，超出截断并在返回的 note 里说明）"}

# ─────────────────────────────────────────────────────────────────────────────
# ext.oss（2026-09-30）: S3 兼容对象存储 —— 手写 AWS Signature V4，零第三方依赖
#
#   · **只做 S3 协议一套**：阿里云 OSS / 腾讯云 COS / MinIO / R2 / Ceph 都兼容 S3，
#     靠 endpoint 区分；不做第二套协议（每多一套协议就要多引一个 SDK，
#     一引就破「go.mod / go.sum 零变动」这条红线）。
#   · **凭据只从入参进**：access_key_id / access_key_secret 每次传（应用侧写 ${secrets.*}，
#     内核执行前展开成明文注入）；侧车不读环境变量、不落库。endpoint / bucket / region
#     同理，**没有配置库回退** —— 与 ext.filestore 不同，是有意的选择：
#     省掉「配置与入参不一致时听谁的」这个歧义源，侧车也就成了无状态进程。
#   · **key 校验**：禁 `..` / 空段 / 前导 `/` / 反斜杠，长度 ≤1024。
#     远端没有符号链接语义，所以**不走** internal/sidecar/outpath。
#   · **大对象走 presign 直传**：内核调侧车的硬超时是 10s
#     （internal/engine/extensions.go:212），put/get 另有 32MiB 上限（可调 max_bytes），
#     再大只能 presign 让客户端直连对象存储，别指望 put 扛得住。
#   · **path_style 自动判**：endpoint 是 IP 时自动走 path-style（MinIO / 自建 Ceph 的默认
#     形态），否则 virtual-host（bucket 打进 host，AWS / 阿里云的默认形态）。可显式指定。
ext.oss:
  cmd: ["plugin/oss-sidecar.exe"]         # 真实侧车（plugin/oss-sidecar）
  methods: [put, get, stat, list, delete, presign]
  service: true                           # 常驻能力：侧车长驻，按调用读写
  listen: "127.0.0.1:8102"                # coord + RPC 端口
  health_probe:
    kind: tcp
    interval: 5s
    threshold: 3
  schemas:
    put:
      description: 上传一个对象（内容走 base64）
      parameters:
        key: {type: string, description: "对象 key（如 reports/2026.xlsx）；禁 .. / 空段 / 前导 / / 反斜杠，长度 ≤1024", required: true}
        data_base64: {type: string, description: "对象内容的 base64", required: true}
        endpoint: {type: string, description: "服务地址，只认 host[:port] 或 scheme://host[:port]（**不带路径**）；不给 scheme 默认 https", required: true}
        region: {type: string, description: "签名区域：AWS/MinIO 通常 us-east-1；阿里云 oss-cn-hangzhou；腾讯云 ap-guangzhou", required: true}
        bucket: {type: string, description: "桶名", required: true}
        access_key_id: {type: string, description: "AK（建议写 ${secrets.oss_ak}）", required: true}
        access_key_secret: {type: string, description: "SK（建议写 ${secrets.oss_sk}）", required: true}
        content_type: {type: string, description: "内容类型（默认 application/octet-stream）"}
        session_token: {type: string, description: "STS 临时凭据的 security token"}
        path_style: {type: boolean, description: "寻址形态；不给则自动判（endpoint 是 IP 时为 true）"}
        max_bytes: {type: number, description: "大小上限（默认 32MiB）；超限在解码前就拒，不会先解进内存"}
    get:
      description: 下载一个对象（返回 base64；大对象请用 presign）
      parameters:
        key: {type: string, description: "同 put 的 key", required: true}
        endpoint: {type: string, description: "同 put 的 endpoint", required: true}
        region: {type: string, description: "同 put 的 region", required: true}
        bucket: {type: string, description: "同 put 的 bucket", required: true}
        access_key_id: {type: string, description: "同 put 的 access_key_id", required: true}
        access_key_secret: {type: string, description: "同 put 的 access_key_secret", required: true}
        session_token: {type: string, description: "同 put 的 session_token"}
        path_style: {type: boolean, description: "同 put 的 path_style"}
        max_bytes: {type: number, description: "读回上限（默认 32MiB），超出即拒"}
    stat:
      description: 取对象元数据（size / content_type / mod_time / etag），不取内容
      parameters:
        key: {type: string, description: "同 put 的 key", required: true}
        endpoint: {type: string, description: "同 put 的 endpoint", required: true}
        region: {type: string, description: "同 put 的 region", required: true}
        bucket: {type: string, description: "同 put 的 bucket", required: true}
        access_key_id: {type: string, description: "同 put 的 access_key_id", required: true}
        access_key_secret: {type: string, description: "同 put 的 access_key_secret", required: true}
        session_token: {type: string, description: "同 put 的 session_token"}
        path_style: {type: boolean, description: "同 put 的 path_style"}
    delete:
      description: 删除一个对象（不存在即 not_found）
      parameters:
        key: {type: string, description: "同 put 的 key", required: true}
        endpoint: {type: string, description: "同 put 的 endpoint", required: true}
        region: {type: string, description: "同 put 的 region", required: true}
        bucket: {type: string, description: "同 put 的 bucket", required: true}
        access_key_id: {type: string, description: "同 put 的 access_key_id", required: true}
        access_key_secret: {type: string, description: "同 put 的 access_key_secret", required: true}
        session_token: {type: string, description: "同 put 的 session_token"}
        path_style: {type: boolean, description: "同 put 的 path_style"}
    list:
      description: 列出对象（ListObjectsV2；prefix 过同一套 key 规矩）
      parameters:
        endpoint: {type: string, description: "同 put 的 endpoint", required: true}
        region: {type: string, description: "同 put 的 region", required: true}
        bucket: {type: string, description: "同 put 的 bucket", required: true}
        access_key_id: {type: string, description: "同 put 的 access_key_id", required: true}
        access_key_secret: {type: string, description: "同 put 的 access_key_secret", required: true}
        prefix: {type: string, description: "只列该前缀下的对象"}
        limit: {type: number, description: "每页条数（默认 1000，上限 1000）"}
        session_token: {type: string, description: "同 put 的 session_token"}
        path_style: {type: boolean, description: "同 put 的 path_style"}
    presign:
      description: 签一个预签名 URL 给客户端直连（大对象上传/下载都走这条，不过侧车）
      parameters:
        key: {type: string, description: "同 put 的 key", required: true}
        endpoint: {type: string, description: "同 put 的 endpoint", required: true}
        region: {type: string, description: "同 put 的 region", required: true}
        bucket: {type: string, description: "同 put 的 bucket", required: true}
        access_key_id: {type: string, description: "同 put 的 access_key_id", required: true}
        access_key_secret: {type: string, description: "同 put 的 access_key_secret", required: true}
        method: {type: string, description: "GET（下载，默认）或 PUT（直传）", enum: [GET, PUT]}
        expires: {type: number, description: "有效期秒数（默认 900，上限 604800＝7 天）"}
        session_token: {type: string, description: "同 put 的 session_token"}
        path_style: {type: boolean, description: "同 put 的 path_style"}
