# web_ui.up：一个 Flow 把 web-ui（静态站）与它的后端一起跑起来。
#
# 四个 step（两个长驻 + 两个一次）：
#   · serve  —— mode: service，call: ext.serve。ext.serve 是 service ext，SetupExtensions
#               会为它生成一个虚拟 process Tool；service step 引用它即走 coord 握手
#               拉起并「持有」serve-sidecar 侧车（占用列表非空 → 侧车不被 OnEmpty 回收）。
#   · api    —— mode: service，call: web_ui.api。process 长驻起 gear REST 后端（/api）。
#   · anchor —— once，call: web_ui.anchor。排序锚点：service step 不能作为依赖，
#               用本步把 site 推到下一层，确保 /start 时侧车已就绪。
#   · site   —— once，call: static_site.serve。向侧车下发 /start：把 dist 托管到 :8080，
#               并把 /api 反代到后端 8787（proxy 规则）——静态与接口同源，UI 才真连得上内核。
#
# 注册（**约定 cwd = 仓库根**）：gear flow register plugin/web_ui_flow.yaml
# 运行（同样在仓库根）：GEAR_EXT_CONFIG=plugin/extensions.yaml \
#         gear app run web_ui.up
#       ／后台：gear app start web_ui.up --port 8080 --port 8787 --wait 10
#
# 为什么两个命令里都没有 `--registry`：**不要**给应用自带的 REST 面写死库路径。
# 起服进程会把本次生效的 registry 绝对化后写进 GEAR_REGISTRY，应用内步骤直接继承——
# 于是 UI 里的列表与你 CLI 的 `gear flow list` 必然同源（2026-09-22 的修法，详见
# plugin/web_ui_tools.yaml 里 web_ui.api 的注释）。真要隔离就传**绝对路径**的 --registry。
#
# 前置：build/gear.exe、build/serve-sidecar.exe 已构建（go build / scripts/build.sh）。
# cwd 约定的可见证据：本文件的 `dir: build/dist` 与 web_ui.api 的 `entry: build/gear.exe`
# 都按「仓库根」解析——docs/README 里的注册与运行示例也都在仓库根执行。
id: web_ui.up
name: Web UI 起服（静态站 + 后端，同源）
description: 用 ext.serve 把 web-ui 的 dist 托管为静态站并把 /api 反代到后端，用 process 起 gear REST 后端；一个 Flow 管两个长驻服务，静态与接口同源。
steps:
  - id: anchor
    call: web_ui.anchor
    input: {}
  # 长驻 1：ext.serve 侧车（类 nginx 的静态网站服务），持有占用使其不被回收。
  - id: serve
    call: ext.serve
    mode: service
    input: {}
  # 长驻 2：gear REST 后端（web-ui 的后台）。
  - id: api
    call: web_ui.api
    mode: service
    input: {}
  # 一次：下发 /start，把 dist 托管出去（依赖 anchor → 落在下一层，侧车必已就绪），
  # 并把 /api 反代到后端（UI 是同源应用：dev 时由 vite proxy 承担这层，生产就是这里）。
  - id: site
    call: static_site.serve
    depends_on: [anchor]
    input:
      port: 8080
      dir: build/dist
      host: 127.0.0.1
      proxy:
        - path: /api
          target: http://127.0.0.1:8787
  # 收尾：把访问地址显式抛出来（否则「启动带网站的服务」后看不到打开地址）。
  # 取 site 步的 url（static_site.serve 经 sidecar 返回），由 web_ui.done 打印到 stdout /
  # 应用日志，并由 launcher 在 app start / app status 输出里显式报「打开地址：…」。
  - id: done
    call: web_ui.done
    depends_on: [site]
    input:
      url: ${steps.site.output.url}
      backend: http://127.0.0.1:8787
