# mindstorm 起服 Flow（配套 mindstorm_tools.yaml）。
# 注册（cwd = 仓库根）：gear flow register apps/mindstorm/mindstorm_flow.yaml
# 运行：build/gear.exe app start mindstorm.up --port 8090 --wait 10
#
# 结构对齐已验证的 v1 brainstorm.up：anchor(once) → ext.serve(service)
# → mindstorm__api(service, process 起 gear serve) → static_site.serve(depends_on anchor,
# 把 www 托管到 8090, /api 反代到 8790)。所有路径用绝对路径（正斜杠）避免 cwd 漂移。
kind: Flow
id: mindstorm.up
name: mindstorm 起服
description: 持有 serve 侧车，把 www 托管到 127.0.0.1:8090，并把 /api 反代到 8790 的 REST 后端
steps:
  - id: anchor
    call: mindstorm__config
    input: {}
  - id: serve
    call: ext.serve
    mode: service
    input: {}
  - id: api
    call: mindstorm__api
    mode: service
    input: {}
  - id: site
    call: static_site.serve
    depends_on: [anchor]
    input:
      port: 8090
      dir: D:/gadern/gear/apps/mindstorm/www
      host: 127.0.0.1
      proxy:
        - path: /api
          target: http://127.0.0.1:8790
