    id: {type: string}
    title: {type: string}
    category: {type: string}
versions:
  - version: "1.0.0"
    state: stable
entry: |
  local DSN = "D:/gadern/gear/build/mindstorm.db"
  local id = ctx.input.id
  local title = ctx.input.title
  local cat = ctx.input.category or ""
  ctx.db.exec({driver="sqlite", dsn=DSN,
    sql="INSERT OR REPLACE INTO trees(id,title,category,updated_at) VALUES(?,?,?,datetime('now'))",
    params={id, title, cat}})
  return {id=id, title=title, category=cat}
