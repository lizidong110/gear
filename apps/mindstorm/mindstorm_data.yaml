kind: Tool
id: mindstorm__node_delete
name: 删除节点（级联子孙，硬删）
runtime: lua
capabilities: [db]
input_schema:
  type: object
  properties:
    id: {type: string}
  required: [id]
output_schema:
  type: object
  properties:
    deleted: {type: string}
versions:
  - version: "1.0.0"
    state: stable
entry: |
  local DSN = "D:/gadern/gear/build/mindstorm.db"
  local id = ctx.input.id
  local r = ctx.db.query({driver="sqlite", dsn=DSN, sql="SELECT path FROM nodes WHERE id=?", params={id}})
  if not r or #r == 0 then error("node 不存在: " .. id) end
  local path = r[1].path
  -- 级联：path 以该节点 path 为前缀的（含自身）全部删除
  ctx.db.exec({driver="sqlite", dsn=DSN, sql="DELETE FROM nodes WHERE path LIKE ?", params={path .. "/%"}})
  ctx.db.exec({driver="sqlite", dsn=DSN, sql="DELETE FROM nodes WHERE id=?", params={id}})
  return {deleted=id}
---
kind: Tool
id: mindstorm__search
name: 搜索节点（标题/摘要/正文）
description: 按关键词全文搜索节点，返回命中节点（含所属树、面包屑、命中片段）。可选 tree_id 限定在单棵树内。
runtime: lua
capabilities: [db]
input_schema:
  type: object
  properties:
    q: {type: string}
    tree_id: {type: string}
    limit: {type: integer}
  required: [q]
output_schema:
  type: object
  properties:
    nodes:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          tree_id: {type: string}
          tree_title: {type: string}
          title: {type: string}
          depth: {type: integer}
          breadcrumb: {type: string}
          snippet: {type: string}
    count: {type: integer}
versions:
  - version: "1.0.0"
    state: stable
entry: |
  local DSN = "D:/gadern/gear/build/mindstorm.db"
  local q = ctx.input.q
  if not q or q == "" then
    return {nodes = ctx.json.decode("[]"), count = 0}
  end
  local limit = ctx.input.limit or 50
  if limit < 1 then limit = 1 end
  if limit > 200 then limit = 200 end
  local tree_id = ctx.input.tree_id
  local like = "%" .. q .. "%"
  local sql, params
  if tree_id and tree_id ~= "" then
    sql = "SELECT id,tree_id,path,depth,title,summary,body FROM nodes WHERE tree_id=? AND (title LIKE ? OR summary LIKE ? OR body LIKE ?) ORDER BY updated_at DESC LIMIT ?"
    params = {tree_id, like, like, like, limit}
  else
    sql = "SELECT id,tree_id,path,depth,title,summary,body FROM nodes WHERE (title LIKE ? OR summary LIKE ? OR body LIKE ?) ORDER BY updated_at DESC LIMIT ?"
    params = {like, like, like, limit}
  end
  local rows = ctx.db.query({driver="sqlite", dsn=DSN, sql=sql, params=params}) or {}

  local ql = q:lower()
  local cache = {}
  local function titleOf(id)
    if cache[id] then return cache[id] end
    local r = ctx.db.query({driver="sqlite", dsn=DSN, sql="SELECT title FROM nodes WHERE id=?", params={id}})
    local t = (r and #r > 0) and r[1].title or "?"
    cache[id] = t
    return t
  end
  local tcache = {}
  local function treeTitle(id)
    if tcache[id] then return tcache[id] end
    local r = ctx.db.query({driver="sqlite", dsn=DSN, sql="SELECT title FROM trees WHERE id=?", params={id}})
    local t = (r and #r > 0) and r[1].title or "?"
    tcache[id] = t
    return t
  end
  local function snippetOf(src)
    if not src or src == "" then return "" end
    local i = string.find(src:lower(), ql, 1, true)
    if not i then return string.sub(src, 1, 80) end
    local s = math.max(1, i - 24)
    local e = math.min(#src, i + #q + 40)
    return (s > 1 and "…" or "") .. string.sub(src, s, e) .. (e < #src and "…" or "")
  end
  local function pickSnippet(r)
    if r.summary and string.find(r.summary:lower(), ql, 1, true) then return snippetOf(r.summary) end
    if r.body and string.find(r.body:lower(), ql, 1, true) then return snippetOf(r.body) end
    if r.summary and r.summary ~= "" then return string.sub(r.summary, 1, 80) end
    if r.body and r.body ~= "" then return string.sub(r.body, 1, 80) end
    return ""
  end

  local out = {}
  for _, r in ipairs(rows) do
    local parts = {}
    for seg in string.gmatch(r.path, "[^/]+") do
      if seg ~= r.id then table.insert(parts, titleOf(seg)) end
    end
    table.insert(out, {id = r.id, tree_id = r.tree_id, tree_title = treeTitle(r.tree_id),
      title = r.title, depth = r.depth, breadcrumb = table.concat(parts, " › "),
      snippet = pickSnippet(r)})
  end
  local j = ctx.json.encode(out)
  if #out == 0 then j = "[]" end
  return {nodes = ctx.json.decode(j), count = #out}
---
kind: Tool
id: mindstorm__tag_add
name: 给节点加标签
runtime: lua
capabilities: [db]
input_schema:
  type: object
  properties:
    node_id: {type: string}
    tag: {type: string}
  required: [node_id, tag]
output_schema:
  type: object
  properties:
    node_id: {type: string}
    tag: {type: string}
versions:
  - version: "1.0.0"
    state: stable
entry: |
  local DSN = "D:/gadern/gear/build/mindstorm.db"
  local node_id = ctx.input.node_id
  local tag = (ctx.input.tag or ""):gsub("^%s+", ""):gsub("%s+$", "")
  if tag == "" then error("tag 不能为空") end
  ctx.db.exec({driver="sqlite", dsn=DSN, sql="INSERT OR IGNORE INTO node_tags(node_id,tag) VALUES(?,?)", params={node_id, tag}})
  return {node_id=node_id, tag=tag}
